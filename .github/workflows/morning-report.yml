name: Morning Insider Report

on:
  schedule:
    # GitHub Actions cron is UTC-only and has no DST awareness, so we run two
    # candidate times and let the "gate" step below decide which one is
    # actually 8:00 AM in America/New_York that day. Only one will ever match.
    - cron: '0 12 * * 1-5'   # 8:00 AM EDT (UTC-4) — roughly mid-Mar to early Nov
    - cron: '0 13 * * 1-5'   # 8:00 AM EST (UTC-5) — roughly early Nov to mid-Mar
  workflow_dispatch: {}      # manual "Run workflow" button — always runs regardless of hour

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on local New York hour (schedule runs only)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding regardless of time." 
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ="America/New_York" date +%H)
          echo "Current America/New_York hour: $hour"
          if [ "$hour" = "08" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 8 AM in New York right now — skipping (the other cron trigger will fire instead)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: Use sample constituents if the real config isn't populated yet
        if: steps.gate.outputs.proceed == 'true'
        run: |
          if [ ! -s config/sp500_constituents.csv ]; then
            echo "config/sp500_constituents.csv missing/empty — falling back to the sample list."
            echo "Run scripts/build_constituents.py locally and commit the real file for full coverage."
            cp config/sp500_constituents.sample.csv config/sp500_constituents.csv
          fi

      - name: Run Insider Ledger pipeline
        if: steps.gate.outputs.proceed == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/fetch_report.py

      - name: Commit and push updated report
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "insider-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/report.json docs/data/history
          git diff --quiet --cached || git commit -m "Morning report: $(TZ='America/New_York' date +'%Y-%m-%d %H:%M %Z')"
          git push
