name: Morning Insider Report

# On-demand only — no automatic schedule. Go to this repo's Actions tab,
# pick "Morning Insider Report", click "Run workflow" whenever you want a
# fresh pull. Takes a couple of minutes; the live dashboard picks up the
# new data automatically on your next page load, no other steps needed.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build full S&P 500 constituent list
        run: |
          python scripts/build_constituents.py || {
            echo "Live build failed — falling back to the 12-company sample list."
            cp config/sp500_constituents.sample.csv config/sp500_constituents.csv
          }

      - name: Run Insider Ledger pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/fetch_report.py

      - name: Commit and push updated report
        run: |
          git config user.name "insider-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/report.json docs/data/history
          git diff --quiet --cached || git commit -m "Manual report refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
